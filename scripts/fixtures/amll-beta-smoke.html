    const fixtureParams = new URLSearchParams(location.search);
    if (!fixtureParams.has('opacityReload')) {
      localStorage.setItem('mineradio-apple-music-lyrics-beta-v1', JSON.stringify({

        showTranslation: true,
        showRomanization: true,
        translationOpacity: 0.21,
        romanizationOpacity: 0.22,
        currentOriginalOpacity: 0.23,
        nonCurrentOriginalOpacity: 0.24,
        currentTranslationOpacity: 0.25,
        nonCurrentTranslationOpacity: 0.26,

        unplayedWordOpacity: 0.29,
        backgroundVocalOpacity: 0.3,
        romanizationScale: 0.68,
        renderQuality: 'high'
      }));
    }
    window.confirm = function(){ return true; };
    window.fx = { particleLyrics: true, spotifyMode: false };
    window.playing = true;
    window.desktopWindow = {
      getState: function(){ return Promise.resolve({ isMinimized:false, isVisible:true }); },
      onStateChange: function(callback){ window.desktopStateListener = callback; return function(){ window.desktopStateListener = null; }; }
    };
    const opacitySmoke = new URLSearchParams(location.search).has('opacitySmoke');
    if (opacitySmoke) {
      window.requestAnimationFrame = callback =>
        window.setTimeout(() => callback(performance.now()), 16);
      window.cancelAnimationFrame = handle => window.clearTimeout(handle);
    }
    window.testLyricTime = opacitySmoke ? 1 : 1.4;
    window.getLyricPlaybackSeconds = function(){ return window.testLyricTime; };
    window.getPlaybackDurationSeconds = function(){ return 24; };
    window.getLyricDelayMs = function(){ return 0; };
    window.currentLyricSong = function(){ return { name:'Beta Smoke' }; };
    window.stageLyrics = { group:{ visible:true } };
    window.tickLyricsParticles = function(){};
    window.lyricTrackLoading = false;
    window.lyricsTimingSource = 'qrc-word';
    window.lyricsBlankSegments = [{ start:3, end:9, duration:6 }];
    window.getActiveLyricBlankSegment = function(segments, time) {
      return segments.find(function(segment){ return time >= segment.start && time < segment.end; }) || null;
    };
    window.getLyricBreathDotState = function(segment, now) {
      const duration = segment.end - segment.start;
      const elapsed = Math.max(0, Math.min(duration, now - segment.start));
      const breathDuration = Math.max(.001, duration - Math.min(.3, duration));
      const step = breathDuration / 3;
      return {
        pulses:[0,1,2].map(function(index) {
          const progress = Math.max(0, Math.min(1, (elapsed - index * step) / step));
          return progress <= 0 ? 0 : (progress >= 1 ? 1 : Math.sin(Math.PI * .5 * progress));
        })
      };
    };

      ],

  <script>
    if (new URLSearchParams(location.search).has('opacitySmoke')) {
      const result = document.createElement('pre');
      result.id = 'amll-opacity-smoke-result';
      result.textContent = 'pending';
      document.body.appendChild(result);
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const waitFor = async (test, timeout = 15000) => {
        const started = performance.now();
        while (performance.now() - started < timeout) {
          if (test()) return;
          await wait(50);
        }
        throw new Error('opacity smoke timeout');
      };
      const styleChain = element => {
        const chain = [];
        for (let node = element; node; node = node.parentElement) {
          const style = getComputedStyle(node);
          chain.push({
            className: node.className || node.id || node.tagName,
            opacity: style.opacity,
            color: style.color,
            filter: style.filter,
            visibility: style.visibility,
          });
        }
        return chain;
      };
      const snapshot = () => Array.from(document.querySelectorAll('.FmKaba_lyricLineWrapper'))
        .map(wrapper => {
          const translation = wrapper.querySelector('.FmKaba_lyricSubLine:nth-child(2)');
          const romanization = wrapper.querySelector('.FmKaba_lyricSubLine:nth-child(3)');
           const romanWord = wrapper.querySelector('.FmKaba_romanWord');
           const mainLine = wrapper.querySelector('.FmKaba_lyricMainLine');
           const innerLine = wrapper.querySelector('.FmKaba_lyricLine');
           const backgroundLine = wrapper.querySelector('.FmKaba_lyricBgLine');
           const backgroundMainLine = backgroundLine
             ? backgroundLine.querySelector('.FmKaba_lyricMainLine')
             : null;
           const originalRun = mainLine && mainLine.querySelector(
             '.mineradio-amll-original-run:not(.FmKaba_romanWord .mineradio-amll-original-run)'
           );
           const latinRuns = Array.from(wrapper.querySelectorAll('.mineradio-amll-latin-run')).map(run => ({
             text:run.textContent,
             letterSpacing:getComputedStyle(run).letterSpacing,
             fontSize:getComputedStyle(run).fontSize,
             inOriginal:!!run.closest('.FmKaba_lyricMainLine') && !run.closest('.FmKaba_romanWord'),
             inTranslation:!!run.closest('.FmKaba_lyricSubLine:nth-child(2)'),
             inRomanization:!!run.closest('.FmKaba_romanWord, .FmKaba_lyricSubLine:nth-child(3)'),
           }));
           const nonLatinOriginalRuns = Array.from(
             mainLine ? mainLine.querySelectorAll('.mineradio-amll-original-run:not(.mineradio-amll-latin-run)') : []
           ).filter(run => !run.closest('.FmKaba_romanWord')).map(run => ({
             text:run.textContent,
             letterSpacing:getComputedStyle(run).letterSpacing,
           }));
           const koreanColumns = Array.from(
             wrapper.querySelectorAll('.mineradio-amll-korean-column')
           ).map(column => {
             const source = column.querySelector('.mineradio-amll-korean-source');
             const roman = column.querySelector('.mineradio-amll-korean-roman');
             const sourceRect = source && source.getBoundingClientRect();
             const romanRect = roman && roman.getBoundingClientRect();
             return {
               sourceText:source && source.textContent,
               romanized:roman && (roman.getAttribute('aria-label') || roman.textContent),
               columnTop:column.getBoundingClientRect().top,
               sourceLeft:sourceRect && sourceRect.left,
               romanLeft:romanRect && romanRect.left,
               sourceWidth:sourceRect && sourceRect.width,
               romanWidth:romanRect && romanRect.width,
               sourceFontSize:source && getComputedStyle(source).fontSize,
               romanFontSize:roman && getComputedStyle(roman).fontSize,
               romanTransform:roman && getComputedStyle(roman).transform,
             };
           });
            const romanWordSegments = Array.from(
              wrapper.querySelectorAll('.FmKaba_lyricMainLine .FmKaba_romanWord')
            ).map(romanWord => {
              const wordElement = romanWord.closest('.FmKaba_wordWithRuby') || romanWord.parentElement;
              const sourceMotion = wordElement && wordElement.querySelector(
                ':scope > .mineradio-amll-source-motion, '
                + ':scope > .FmKaba_wordBody > .mineradio-amll-source-motion'
              );
              const wordStyle = wordElement && getComputedStyle(wordElement);
              const maskSize = wordStyle ? parseFloat(wordStyle.maskSize) : NaN;
              const sourceStyle = sourceMotion && getComputedStyle(sourceMotion);
              const sourceFontSize = sourceStyle ? parseFloat(sourceStyle.fontSize) : NaN;
              const wordRect = wordElement && wordElement.getBoundingClientRect();
              const mainRect = mainLine && mainLine.getBoundingClientRect();
              const sourceRect = sourceMotion && sourceMotion.getBoundingClientRect();
              const romanRect = romanWord.getBoundingClientRect();
              const segments = Array.from(
                romanWord.querySelectorAll('.mineradio-amll-roman-syllable')
              );
             const fontSize = parseFloat(getComputedStyle(romanWord).fontSize) || 1;
             return {
               text:romanWord.getAttribute('aria-label') || romanWord.textContent.trim(),
               segments:segments.map(segment => segment.textContent),
                gapsEm:segments.slice(1).map((segment, index) => {
                 const previous = segments[index].getBoundingClientRect();
                 const current = segment.getBoundingClientRect();
                  return (current.left - previous.right) / fontSize;
                }),
                maskFadeWidth:Number.isFinite(maskSize) && wordRect
                  ? Math.max(0, maskSize / 100 - 2) * wordElement.clientWidth
                  : null,
                expectedSourceFadeWidth:Number.isFinite(sourceFontSize)
                  ? sourceFontSize * 0.5
                  : null,
                sourceMotionCount:wordElement
                  ? wordElement.querySelectorAll('.mineradio-amll-source-motion').length
                  : 0,
                sourceFloatAnimationCount:sourceMotion
                  ? sourceMotion.getAnimations().filter(animation => animation.id === 'float-word').length
                  : 0,
                sourceFloatKeyframes:sourceMotion
                  ? sourceMotion.getAnimations().filter(animation => animation.id === 'float-word')
                    .flatMap(animation => animation.effect.getKeyframes().map(keyframe => keyframe.transform))
                  : [],
                romanFloatAnimationCount:romanWord.getAnimations({ subtree:true })
                  .filter(animation => animation.id === 'float-word').length,
                romanTop:romanRect.top,
                romanOffsetFromMain:mainRect ? romanRect.top - mainRect.top : null,
                sourceOffsetFromMain:mainRect && sourceRect ? sourceRect.top - mainRect.top : null,
              };
            });
           const appleKoreanLexicalWords = Array.from(
             wrapper.querySelectorAll('.FmKaba_wordWithRuby')
           ).map(word => {
             const ruby = word.querySelector('.FmKaba_rubyWord');
             const body = word.querySelector('.FmKaba_wordBody');
             const roman = body && body.querySelector('.FmKaba_romanWord');
             const sourceChildren = body && Array.from(body.children)
               .filter(child => !child.classList.contains('FmKaba_romanWord'));
             if (!ruby || !ruby.children.length || !sourceChildren.length || !roman) return null;
             const glyphRects = [];
             sourceChildren.forEach(sourceChild => {
               const walker = document.createTreeWalker(sourceChild, NodeFilter.SHOW_TEXT);
               while (walker.nextNode()) {
                 const textNode = walker.currentNode;
                 for (let offset = 0; offset < textNode.data.length; offset++) {
                   if (!/[가-힣]/u.test(textNode.data[offset])) continue;
                   const range = document.createRange();
                   range.setStart(textNode, offset);
                   range.setEnd(textNode, offset + 1);
                   glyphRects.push(range.getBoundingClientRect());
                 }
               }
             });
             let sourceGapEm = null;
             if (glyphRects.length >= 2) {
               const fontSize = parseFloat(getComputedStyle(sourceChildren[0]).fontSize) || 1;
               sourceGapEm = (glyphRects[1].left - glyphRects[0].right) / fontSize;
             }
             const romanRect = roman.getBoundingClientRect();
             return {
               sourceText:sourceChildren.map(child => child.textContent).join('').trim(),
               romanized:roman.getAttribute('aria-label') || roman.textContent.trim(),
               lexicalTiming:word.hasAttribute('data-mineradio-apple-korean-lexical-timing'),
               isBackground:!!word.closest('.FmKaba_lyricBgLine'),
               maskPosition:getComputedStyle(word).maskPosition,
               sourceGapEm,
               sourceLeft:glyphRects.length ? glyphRects[0].left
                 : sourceChildren[0].getBoundingClientRect().left,
               romanLeft:romanRect.left,
               rubyDisplay:getComputedStyle(ruby).display,
               rubyTimes:Array.from(ruby.children).map(segment => ({
                 text:segment.textContent,
                 start:Number(segment.dataset.startTime),
                 end:Number(segment.dataset.endTime),
               })),
             };
           }).filter(Boolean);
           const appleKoreanWordColumns = Array.from(
             wrapper.querySelectorAll('.FmKaba_wordWithRuby')
           ).map(word => {
             const body = word.querySelector(':scope > .FmKaba_wordBody');
             const roman = body && body.querySelector(':scope > .FmKaba_romanWord');
             if (!body || !roman) return null;
              const sourceLayer = body.querySelector(':scope > .mineradio-amll-apple-word-source');
              const sourceMotion = body.querySelector('.mineradio-amll-source-motion');
             const sourceRoots = sourceLayer ? [sourceLayer] : Array.from(body.children)
               .filter(child => child !== roman);
             const glyphRects = [];
             sourceRoots.forEach(root => {
               const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
               while (walker.nextNode()) {
                 const textNode = walker.currentNode;
                 for (let offset = 0; offset < textNode.data.length; offset++) {
                   if (!/\S/u.test(textNode.data[offset])) continue;
                   const range = document.createRange();
                   range.setStart(textNode, offset);
                   range.setEnd(textNode, offset + 1);
                   glyphRects.push(range.getBoundingClientRect());
                 }
               }
             });
             if (!glyphRects.length) return null;
             const sourceLeft = Math.min(...glyphRects.map(rect => rect.left));
             const sourceRight = Math.max(...glyphRects.map(rect => rect.right));
             const sourceFontSize = parseFloat(getComputedStyle(sourceRoots[0]).fontSize) || 1;
             const romanRect = roman.getBoundingClientRect();
              const bodyRect = body.getBoundingClientRect();
              const wordStyle = getComputedStyle(word);
              const maskSize = parseFloat(wordStyle.maskSize);
              const sourceMotionStyle = sourceMotion && getComputedStyle(sourceMotion);
              return {
               sourceText:sourceRoots.map(root => root.textContent).join('').trim(),
               romanized:roman.getAttribute('aria-label') || roman.textContent.trim(),
               wordLayout:word.hasAttribute('data-mineradio-apple-korean-word-layout'),
               lexicalTiming:word.hasAttribute('data-mineradio-apple-korean-lexical-timing'),
               sourceLeft,
               sourceWidth:sourceRight - sourceLeft,
               romanLeft:romanRect.left,
               romanWidth:romanRect.width,
               romanFontSize:getComputedStyle(roman).fontSize,
               columnWidth:bodyRect.width,
               columnTop:word.getBoundingClientRect().top,
               glyphRows:new Set(glyphRects.map(rect => Math.round(rect.top))).size,
                glyphTopSpreadEm:(Math.max(...glyphRects.map(rect => rect.top))
                  - Math.min(...glyphRects.map(rect => rect.top))) / sourceFontSize,
                maskFadeWidth:Number.isFinite(maskSize)
                  ? Math.max(0, maskSize / 100 - 2) * word.clientWidth
                  : null,
                expectedSourceFadeWidth:sourceMotionStyle
                  ? parseFloat(sourceMotionStyle.fontSize) * 0.5
                  : null,
                sourceMotionCount:word.querySelectorAll('.mineradio-amll-source-motion').length,
                sourceFloatAnimationCount:sourceMotion
                  ? sourceMotion.getAnimations().filter(animation => animation.id === 'float-word').length
                  : 0,
                sourceFloatKeyframes:sourceMotion
                  ? sourceMotion.getAnimations().filter(animation => animation.id === 'float-word')
                    .flatMap(animation => animation.effect.getKeyframes().map(keyframe => keyframe.transform))
                  : [],
                romanFloatAnimationCount:roman.getAnimations({ subtree:true })
                  .filter(animation => animation.id === 'float-word').length,
              };
           }).filter(Boolean);
           const appleKoreanLexicalMarkerCount = wrapper.querySelectorAll(
             '.FmKaba_wordWithRuby[data-mineradio-apple-korean-lexical-timing]'
           ).length;
           return {
             text: mainLine ? mainLine.textContent.trim().replace(/\s+/g, ' ') : '',
             state: wrapper.getAttribute('data-mineradio-line-state'),
             anchorCurrent:wrapper.hasAttribute('data-mineradio-anchor-current'),
             wrapperTop:wrapper.getBoundingClientRect().top,
             anchorY:(() => {
               const stage = document.getElementById('apple-music-lyrics-beta-surface');
               const rect = stage.getBoundingClientRect();
               return rect.top + rect.height * window.MineradioAppleMusicLyrics.getSettings().anchorPosition;
             })(),
            wrapperOpacity: getComputedStyle(wrapper).opacity,
            innerOpacity: innerLine ? getComputedStyle(innerLine).opacity : 0,
            translationRootOpacity: getComputedStyle(
              document.querySelector('.mineradio-amll-player')
            ).getPropertyValue('--amll-beta-translation-opacity').trim(),
            translationLineOpacity: getComputedStyle(wrapper)
              .getPropertyValue('--amll-beta-translation-line-opacity').trim(),
            translationStyle: translation ? translation.getAttribute('style') : null,
            translationTransition: translation ? getComputedStyle(translation).transitionProperty : null,
            translationAnimations: translation ? translation.getAnimations().map(animation => ({
              id: animation.id,
              currentTime: animation.currentTime,
              playState: animation.playState,
              keyframes: animation.effect && typeof animation.effect.getKeyframes === 'function'
                ? animation.effect.getKeyframes().map(keyframe => ({
                  offset:keyframe.offset,
                  opacity:keyframe.opacity,
                }))
                : [],
            })) : [],
            translation: translation ? styleChain(translation) : null,
             romanization: romanization && romanization.textContent.trim()
               ? styleChain(romanization)
               : null,
             romanWord: romanWord ? styleChain(romanWord) : null,
             romanWordSegments,
             appleKoreanLexicalTiming:appleKoreanLexicalWords.some(word => word.lexicalTiming),
             appleKoreanLexicalWords,
             appleKoreanWordColumns,
             appleKoreanLexicalMarkerCount,
             koreanColumns,
             flatRomanDisplay:romanization ? getComputedStyle(romanization).display : null,
             original: originalRun ? styleChain(originalRun) : null,
             background: backgroundLine ? styleChain(backgroundLine) : null,
             latinRuns,
             nonLatinOriginalRuns,
             emphasisAnimations: mainLine ? mainLine.getAnimations({ subtree:true })
               .map(animation => String(animation.id || ''))
               .filter(id => id.includes('emphasize-word')) : [],
            romanizationAnimations: [romanization, romanWord].filter(Boolean).flatMap(element =>
              element.getAnimations().filter(animation => {
                const effect = animation.effect;
                if (!effect || typeof effect.getKeyframes !== 'function') return false;
                return effect.getKeyframes().some(keyframe => keyframe.opacity !== undefined);
              }).map(animation => ({ id:animation.id, playState:animation.playState }))
            ),
             darkMaskAlpha: mainLine
               ? getComputedStyle(mainLine).getPropertyValue('--dark-mask-alpha').trim()
               : '',
             brightMaskAlpha: mainLine
               ? getComputedStyle(mainLine).getPropertyValue('--bright-mask-alpha').trim()
               : '',
             backgroundDarkMaskAlpha: backgroundMainLine
               ? getComputedStyle(backgroundMainLine).getPropertyValue('--dark-mask-alpha').trim()
               : '',
             backgroundBrightMaskAlpha: backgroundMainLine
               ? getComputedStyle(backgroundMainLine).getPropertyValue('--bright-mask-alpha').trim()
               : '',
             backgroundText: backgroundMainLine
               ? backgroundMainLine.textContent.trim().replace(/\s+/g, ' ')
               : '',
             backgroundAnimations: backgroundLine ? backgroundLine.getAnimations({ subtree:true })
               .map(animation => ({
                 id:String(animation.id || ''),

           lifecycleDragTarget.addEventListener('pointerdown', function(){ lifecycleDragReceived = true; });
           document.body.appendChild(lifecycleDragTarget);
           const lifecycleLyrics = window.lyricsLines;
           let lifecycleReloadCalls = 0;
           window.reloadCurrentLyricForSourcePolicy = function(){
             lifecycleReloadCalls += 1;
             window.lyricsLines = [];
             window.lyricTrackLoading = true;
             return new Promise(function(){});
           };
           const lifecycleEnabledControl = document.querySelector('[data-amll-setting="enabled"]');
           lifecycleEnabledControl.checked = false;
           lifecycleEnabledControl.dispatchEvent(new Event('change', { bubbles:true }));
           await wait(16);
           const lifecyclePlayerPrototype = window.MineradioAMLLCore.LyricPlayer.prototype;
           const lifecycleOriginalOptimizeOptions = lifecyclePlayerPrototype.setOptimizeOptions;
           let lifecycleFailedPlayerAttempts = 0;
           lifecyclePlayerPrototype.setOptimizeOptions = function(){
             lifecycleFailedPlayerAttempts += 1;
             throw new Error('forced AMLL configure failure');
           };
           lifecycleEnabledControl.checked = true;
           lifecycleEnabledControl.dispatchEvent(new Event('change', { bubbles:true }));
           await wait(80);
           lifecycleEnabledControl.checked = false;
           lifecycleEnabledControl.dispatchEvent(new Event('change', { bubbles:true }));
           lifecyclePlayerPrototype.setOptimizeOptions = lifecycleOriginalOptimizeOptions;
           await wait(48);
           const failedRendererLifecycle = {
             attempts:lifecycleFailedPlayerAttempts,
             playerCount:document.querySelectorAll('.mineradio-amll-player').length,
             surfaceChildren:document.getElementById('apple-music-lyrics-beta-surface').children.length,
           };
           const lifecycleHitTarget = document.elementFromPoint(180, 160);
           if (lifecycleHitTarget) lifecycleHitTarget.dispatchEvent(new PointerEvent('pointerdown', { bubbles:true }));
           const lifecycleStage = document.getElementById('apple-music-lyrics-beta-stage');
           const lifecycleSurface = document.getElementById('apple-music-lyrics-beta-surface');
           const lifecyclePlayer = document.querySelector('.mineradio-amll-player');
           const disabledLifecycle = {
             settingsEnabled:window.MineradioAppleMusicLyrics.getSettings().enabled,
             bodyActive:document.body.classList.contains('apple-music-lyrics-beta-active'),
             stageActive:lifecycleStage.classList.contains('active'),
             stageAriaHidden:lifecycleStage.getAttribute('aria-hidden'),
             stageInert:lifecycleStage.inert === true,
             surfacePointerEvents:getComputedStyle(lifecycleSurface).pointerEvents,
             regularLyricsVisible:window.stageLyrics.group.visible,
             lyricsPreserved:window.lyricsLines === lifecycleLyrics && window.lyricsLines.length > 0,
             reloadCalls:lifecycleReloadCalls,
             playerCount:document.querySelectorAll('.mineradio-amll-player').length,
             playerAnimationCount:lifecyclePlayer
               ? lifecyclePlayer.getAnimations({ subtree:true }).filter(function(animation){
                   return animation.playState === 'running' || animation.playState === 'paused';
                 }).length
               : 0,
             hitTarget:lifecycleHitTarget && lifecycleHitTarget.id,
             dragReceived:lifecycleDragReceived,
           };

           for (let lifecycleCycle = 0; lifecycleCycle < 10; lifecycleCycle += 1) {
             lifecycleEnabledControl.checked = true;
             lifecycleEnabledControl.dispatchEvent(new Event('change', { bubbles:true }));
             await waitFor(() => document.querySelectorAll('.mineradio-amll-player').length === 1);
             lifecycleEnabledControl.checked = false;
             lifecycleEnabledControl.dispatchEvent(new Event('change', { bubbles:true }));
             await wait(16);
           }
           const repeatedToggleLifecycle = {
             reloadCalls:lifecycleReloadCalls,
             playerCount:document.querySelectorAll('.mineradio-amll-player').length,
             regularLyricsVisible:window.stageLyrics.group.visible,
             surfacePointerEvents:getComputedStyle(lifecycleSurface).pointerEvents,
           };
           lifecycleDragTarget.remove();
           result.textContent = JSON.stringify({
             before, rolling, later, lrc, lrcRescaled, lrcResized, savedSettings,
             reloadSettings, resetState, removedOpacitySettings,
              virtualizedFifth, virtualizedSixth, virtualizedSeventh, virtualizedSeekBack,
              virtualizedRemount,
              appleBackgroundBeforeStart, appleBackgroundStarted,
              appleBackgroundPaused, appleBackgroundPausedHeld,
              appleBackgroundResumed, appleBackgroundSeekBack, appleBackgroundFinished,
              qrcBackgroundBeforeStart, qrcBackgroundStarted,
              appleOverlapBefore, appleOverlapStarted, appleOverlapRolling,
             appleOverlapFirstHeld, appleOverlapReleased,
             appleReverseOverlapRolling, appleReverseOverlapReleased,
             appleReverseOverlapSeekBack,
             appleChainedOverlapRolling, appleChainedOverlapHeld,
             appleChainedOverlapReleased,
             appleVirtualOverlapFirstMount, appleVirtualOverlapRemount,
             appleVirtualMicroFirstMount, appleVirtualMicroRemount,
             appleOverlapCapBeforeFourth, appleOverlapCapAtFourth,
             appleOverlapCapSecondGroup,
             appleMicroOverlapBefore, appleMicroOverlapAccelerating,
             appleMicroOverlapHandoff, appleMicroOverlapStarted,
             appleMicroOverlapSeekBack, appleMicroOverlapClusterTail,
             appleGapHolding, appleGapEarly, appleGapStarted,
             appleLineEarly, appleLineDisabled,
             appleKoreanLexicalFirst, appleKoreanLexicalSecondSyllable,
             appleKoreanLexicalSecond,
             appleKoreanLexicalRebuilt, appleKoreanLexicalVirtualized,
             appleKoreanLexicalBackground,
             appleKoreanAlignmentFirst, appleKoreanAlignmentSecond,
             appleKoreanAlignmentThird, appleKoreanAlignmentRescaled,
             appleKoreanAlignmentNarrow,
             failedRendererLifecycle, disabledLifecycle, repeatedToggleLifecycle,
           });
          result.dataset.done = 'true';
        } catch (error) {
          result.textContent = String(error && error.stack || error);
          result.dataset.done = 'error';
        }
      })();
    }
  </script>
</body>
</html>
